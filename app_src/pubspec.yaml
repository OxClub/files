name: oxfiles
description: Ox Files - fast, private file manager with ZIP support.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  archive: ^3.6.1
  permission_handler: ^11.3.1
  open_filex: ^4.5.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0A0F14"
  adaptive_icon_foreground: "assets/icon/icon_fg.png"
  min_sdk_android: 21
