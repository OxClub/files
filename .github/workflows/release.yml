name: Signed release APK
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Decode keystore
        run: echo "${{ secrets.OX_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/oxfiles.jks"
      - name: Build signed release APK
        env:
          OX_KEYSTORE_FILE: ${{ runner.temp }}/oxfiles.jks
          OX_KEYSTORE_PASSWORD: ${{ secrets.OX_KEYSTORE_PASSWORD }}
          OX_KEY_ALIAS: ${{ secrets.OX_KEY_ALIAS }}
          OX_KEY_PASSWORD: ${{ secrets.OX_KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace
      - name: Verify signature
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: oxfiles-release-apk
          path: app/build/outputs/apk/release/app-release.apk
