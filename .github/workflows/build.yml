name: Build and Release APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Flutter project and add our code
        run: |
          flutter create --project-name filezip --org com.filezip --platforms android app
          cp app_src/pubspec.yaml app/pubspec.yaml
          cp app_src/main.dart app/lib/main.dart
          rm -rf app/test app/analysis_options.yaml
          sed -i 's|<application|<uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>\n    <application|' app/android/app/src/main/AndroidManifest.xml

      - name: Build release APK
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: FileZip v1.0.${{ github.run_number }}
          files: app/build/app/outputs/flutter-apk/app-release.apk
