name: Build and Release Ox Files

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["**.md", "store_assets/**"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.32.x"

      - name: Create Flutter project (com.oxclub.oxfiles) and add our code
        run: |
          flutter create --project-name oxfiles --org com.oxclub --platforms android app
          cp app_src/pubspec.yaml app/pubspec.yaml
          rm -rf app/lib app/test app/analysis_options.yaml
          cp -r app_src/lib app/lib
          cp -r app_src/assets app/assets
          M=app/android/app/src/main/AndroidManifest.xml
          sed -i 's|android:label="oxfiles"|android:label="Ox Files"|' $M
          sed -i 's|<application|<uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29"/>\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/>\n    <application|' $M

      - name: Generate launcher icons
        working-directory: app
        run: |
          flutter pub get
          dart run flutter_launcher_icons

      - name: Build release APK
        working-directory: app
        run: |
          flutter build apk --release \
            --build-name=1.0.${{ github.run_number }} \
            --build-number=${{ github.run_number }}

      - name: Sign APK
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          IN=app/build/app/outputs/flutter-apk/app-release.apk
          OUT=OxFiles-v1.0.${{ github.run_number }}.apk
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > ks.jks
            APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
            "$APKSIGNER" sign --ks ks.jks --ks-pass "pass:$KS_PASS" \
              --key-pass "pass:${KEY_PASS:-$KS_PASS}" --ks-key-alias "$KS_ALIAS" \
              --out "$OUT" "$IN"
            rm -f ks.jks
            echo "Signed with release keystore"
          else
            cp "$IN" "$OUT"
            echo "::warning::No keystore secrets set - APK is debug-signed (not for Amazon upload)"
          fi
          echo "APK_NAME=$OUT" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: OxFiles-apk
          path: ${{ env.APK_NAME }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Ox Files v1.0.${{ github.run_number }}
          files: ${{ env.APK_NAME }}
